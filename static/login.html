<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ورود · DNS Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body class="login-body">
  <svg class="net" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
    <g stroke="#4d74e0" stroke-width="1" opacity=".35">
      <line x1="60" y1="80" x2="220" y2="160"/><line x1="220" y1="160" x2="180" y2="300"/>
      <line x1="220" y1="160" x2="380" y2="120"/><line x1="380" y1="120" x2="520" y2="220"/>
      <line x1="520" y1="220" x2="700" y2="160"/><line x1="180" y1="300" x2="340" y2="380"/>
      <line x1="340" y1="380" x2="520" y2="220"/><line x1="520" y1="220" x2="600" y2="380"/>
      <line x1="60" y1="80" x2="180" y2="300"/>
    </g>
    <g fill="#4d74e0" opacity=".55">
      <circle cx="60" cy="80" r="3"/><circle cx="220" cy="160" r="3"/><circle cx="180" cy="300" r="3"/>
      <circle cx="380" cy="120" r="3"/><circle cx="520" cy="220" r="3"/><circle cx="700" cy="160" r="3"/>
      <circle cx="340" cy="380" r="3"/><circle cx="600" cy="380" r="3"/>
    </g>
  </svg>

  <form class="login-card" method="POST" action="/login">
    <div class="login-brand">
      <div class="brand-mark"><i data-lucide="radio-tower"></i></div>
      <div>
        <div class="login-brand-title">DNS Panel</div>
        <div class="login-brand-sub">تحلیل و مشاهده‌ی کوئری‌ها</div>
      </div>
    </div>
    <div id="loginError" class="login-error">نام کاربری یا رمز عبور اشتباه است.</div>
    <label class="login-label">نام کاربری</label>
    <input class="input" style="width:100%" type="text" name="username" autofocus required />
    <label class="login-label">رمز عبور</label>
    <input class="input" style="width:100%" type="password" name="password" required />
    <button class="btn-primary" type="submit">ورود</button>
  </form>

  <script>
    if (new URLSearchParams(location.search).get("error")) {
      document.getElementById("loginError").classList.add("show");
    }
    lucide.createIcons();
  </script>
</body>
</html>
